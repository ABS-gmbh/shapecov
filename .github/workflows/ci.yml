# Checks that run on every push and pull request, and weekly. Each job is named after the RFP
# acceptance check it covers; VERIFY.md maps every check to its job and command. RFP check 2
# (the replay harness) is replay.yml, called from here by the `replay` job: on every push to main,
# and on a pull request or branch push only when it changes a replay path. The last job, `green`,
# passes only if every other job passed or was skipped on purpose: it is the one check to look at.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays: the linter job then runs against wallet-backend main instead of the pinned commit.
    - cron: "17 4 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Runs on main are never cancelled: each
# gets its own group.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: "Changes: does this push or pull request touch a replay path?"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      replay: ${{ steps.diff.outputs.replay }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        name: git diff against the base (a pull request's base; for a branch push, its merge base with main)
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "push to main: the replay always runs"; echo "replay=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "$EVENT: replay.yml runs on its own schedule and by hand"; echo "replay=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base=$(git merge-base origin/main HEAD); fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(harness/replay/|corpus/manifest\.json$|corpus/entries/|corpus/localcore-reproducible\.json$|tools/localcore[^/]*\.py$|harness/sightings/|tools/oracle\.py$)'; then
            echo "a replay path changed: the replay runs"; echo "replay=true" >> "$GITHUB_OUTPUT"
          else
            echo "no replay path changed: the replay is skipped"; echo "replay=false" >> "$GITHUB_OUTPUT"
          fi

  replay:
    name: replay
    needs: changes
    if: needs.changes.outputs.replay == 'true'
    uses: ./.github/workflows/replay.yml

  quickcheck:
    name: "Quick check: python3 quickcheck.py, as the README tells a reviewer to run it"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 quickcheck.py

  corpus:
    name: "RFP check 1: corpus entries agree with the stellar-core --check-lcm goldens"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0
      - name: Encoder self-tests (SEP-23 strkey, RFC 8032 ed25519)
        run: |
          python tools/strkey.py
          python tools/ed25519.py
      - name: stellar-core golden LedgerCloseMeta (test-lcm-current only) at the commit the manifest names
        run: |
          commit=$(python -c 'import json; print(*sorted({e["source"]["stellar_core_commit"] for e in json.load(open("corpus/manifest.json"))["entries"] if e["source"]["kind"] == "stellar_core_golden"}))')
          git init -q "$RUNNER_TEMP/core" && cd "$RUNNER_TEMP/core"
          git sparse-checkout set --no-cone /test-lcm-current/
          git fetch -q --depth 1 --filter=blob:none https://github.com/stellar/stellar-core.git "$commit"
          git checkout -q FETCH_HEAD
          echo "stellar-core $commit: $(find test-lcm-current -name '*.xdr' | wc -l) golden files"
      - name: Every entry (independent decoder, hashes, expectations); golden entries byte-identical to core's
        run: python tools/corpus_check.py --quiet --goldens "$RUNNER_TEMP/core"

  guide:
    name: "RFP check 4: the guide's field-by-field tables agree with the corpus manifest and with stellar-core's answers"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Guide tables against the manifest, the probe records and the corpus
        run: python guide/check_guide.py
      - name: stellar-core 30.0.0, by the digest in security/images.lock.json
        run: python3 security/images.py pull stellar/stellar-core:30.0.0-3642.0e49751aa.noble
      - name: Every probe submitted again to a local stellar-core; each must get the recorded answer
        run: python guide/probe_core.py check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: The developers.stellar.org page is current, formatted with stellar-docs' own prettier config
        run: |
          npm install --prefix "$RUNNER_TEMP/prettier" --no-audit --no-fund prettier@3.9.10 @stellar/prettier-config@1.2.0
          python guide/export_docs.py --prettier "$RUNNER_TEMP/prettier" --check

  linter:
    name: "RFP check 3: linter flags seeded violations; no wallet-backend finding outside the accepted list"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: linter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: linter/go.mod
          cache-dependency-path: linter/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: Seeded violations and correct code (analysistest)
        run: go test -count=1 ./...
      - name: wallet-backend at the commit pinned in accepted/wallet-backend.json (weekly run, main)
        run: |
          ref=$(python3 -c 'import json; print(json.load(open("accepted/wallet-backend.json"))["pinned_commit"])')
          if [ "${{ github.event_name }}" = "schedule" ]; then ref=main; fi
          git init -q "$RUNNER_TEMP/wb" && cd "$RUNNER_TEMP/wb"
          git fetch -q --depth 1 https://github.com/stellar/wallet-backend.git "$ref"
          git checkout -q FETCH_HEAD
          echo "wallet-backend $ref = $(git rev-parse HEAD)"
          go mod download
      - name: No finding outside accepted/wallet-backend.json
        run: |
          go build -o "$RUNNER_TEMP/lint" ./cmd/shapecov-lint
          set +e
          "$RUNNER_TEMP/lint" -C "$RUNNER_TEMP/wb" -o "$RUNNER_TEMP/report.json" ./...
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then echo "linter error (exit $code)"; exit 1; fi
          python3 scripts/check_accepted.py "$RUNNER_TEMP/report.json" accepted/wallet-backend.json

  linter-stellar-etl:
    name: "RFP check 3: linter on a second indexer, stellar-etl; no finding outside its accepted list"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: linter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # stellar-etl's own Dockerfile pins Go 1.27.3; Go 1.27.4 refuses to load its cgo dependency
      # go-stellar-xdr-json ("disallowed LTO section .llvmbc in #cgo LDFLAGS").
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: linter/go.sum
      - name: stellar-etl at the commit pinned in accepted/stellar-etl.json
        run: |
          ref=$(python3 -c 'import json; print(json.load(open("accepted/stellar-etl.json"))["pinned_commit"])')
          git init -q "$RUNNER_TEMP/etl" && cd "$RUNNER_TEMP/etl"
          git fetch -q --depth 1 https://github.com/stellar/stellar-etl.git "$ref"
          git checkout -q FETCH_HEAD
          echo "stellar-etl $ref = $(git rev-parse HEAD)"
          go mod download
      - name: No finding outside accepted/stellar-etl.json
        run: |
          go build -o "$RUNNER_TEMP/lint" ./cmd/shapecov-lint
          set +e
          "$RUNNER_TEMP/lint" -C "$RUNNER_TEMP/etl" -o "$RUNNER_TEMP/report.json" ./...
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then echo "linter error (exit $code)"; exit 1; fi
          python3 scripts/check_accepted.py "$RUNNER_TEMP/report.json" accepted/stellar-etl.json

  conformance:
    name: "RFP checks 1 and 5: entries round-trip in rs-stellar-xdr and five more decoders; js-stellar-sdk #1766, #1785, #1789 reproduce on pre-fix tags"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: corpus
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: pip install jsonschema==4.23.0
      - name: Rust runner (rs-stellar-xdr, the reference)
        working-directory: runners/rust
        run: cargo build --release --locked
      - name: JavaScript runner
        working-directory: runners/js
        run: npm ci --no-audit --no-fund
      - name: Python runner
        run: |
          python -m venv runners/python/.venv
          runners/python/.venv/bin/pip install stellar-sdk==17.0.1
      - name: Python runner for stellar-xdr, the package replacing stellar_sdk.xdr
        run: |
          python -m venv runners/python-xdr/.venv
          runners/python-xdr/.venv/bin/pip install -r runners/python-xdr/requirements.txt
      - name: Go and Maven images, by the digests in security/images.lock.json
        run: python3 security/images.py pull golang:1.26 maven:3.9-eclipse-temurin-21
      - name: Go runner
        run: docker run --rm -v "$PWD/runners/go:/work" golang:1.26 sh /work/build.sh
      - name: Java runner
        # The plugin is named in full so Maven need not resolve the "dependency" prefix, a lookup
        # that failed once on a Maven Central hiccup; three attempts cover the rest.
        run: |
          for attempt in 1 2 3; do
            docker run --rm -v "$PWD/runners/java:/work" -w /work maven:3.9-eclipse-temurin-21 \
              sh -c "mvn -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DoutputDirectory=lib && javac -cp 'lib/*' Runner.java" \
              && exit 0
            echo "attempt $attempt failed"; sleep 20
          done
          exit 1
      - name: stellar-core 30.0.0, by the digest in security/images.lock.json
        run: python3 security/images.py pull stellar/stellar-core:30.0.0-3642.0e49751aa.noble
      - name: Pinned-SDK checks (the js-stellar-sdk sightings on their pre-fix and fixed releases)
        working-directory: harness/sdk-semantic
        run: npm install --no-audit --no-fund
      - name: Every entry through six SDKs, stellar-core and the pinned-SDK checks
        run: python tools/corpus_check.py --sdks rust,js,python,python-xdr,go,java --core --sdk-checks --quiet
      - name: The same behaviour checks in Go, Java, Rust and both Python SDKs (do they share the JavaScript defects?)
        run: python harness/sdk-semantic/siblings.py --check

  findings:
    name: "RFP check 6: every replay failure maps to a complete finding record"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: FINDINGS.json records, and every failure in the committed replay results mapped to one
        run: python .github/scripts/check_findings.py

  counts:
    name: "Docs: headline numbers match the repository"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Counts stated in README, VERIFY, ARCHITECTURE and the corpus and sightings READMEs
        run: python .github/scripts/check_counts.py

  unit-tests:
    name: "Unit tests (tests/), with line coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SHAPECOV_ROOT: ${{ github.workspace }}
      COVERAGE_PROCESS_START: ${{ github.workspace }}/tests/coverage.ini
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install jsonschema and coverage; measure the scripts the tests run as subprocesses
        run: |
          pip install jsonschema==4.23.0 coverage==7.6.10
          echo "import coverage; coverage.process_startup()" > "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/coverage-subprocess.pth"
      - name: python -m unittest discover -s tests -t . -v
        run: coverage run --rcfile=tests/coverage.ini -m unittest discover -s tests -t . -v
      - name: python quickcheck.py --full (every quick check, the mutation testing of the oracle included)
        run: python quickcheck.py --full
      - name: Line and branch coverage
        if: always()
        run: |
          coverage combine --rcfile=tests/coverage.ini -q
          coverage report --rcfile=tests/coverage.ini

  security:
    name: "Security: pinned images and actions, workflow permissions, no internet route from the replay network"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Static checks (THREAT-MODEL.md)
        run: python3 security/check.py
      - name: The isolation test's image, by digest, and the local tag verified against the lock
        run: |
          python3 security/images.py pull python:3.14-slim
          python3 security/images.py verify python:3.14-slim
      - name: No internet route from an --internal network or --network none, with a control
        run: python3 security/isolation.py --control

  # The packaged forms other repositories use (ADOPT.md), exercised here on every push.
  reusable-conformance-js:
    name: "Reusable sdk-conformance workflow: js-stellar-sdk 17.4.0"
    uses: ./.github/workflows/sdk-conformance.yml
    with:
      sdk: js
      version: "17.4.0"
      corpus-ref: ${{ github.sha }}

  reusable-conformance-go:
    name: "Reusable sdk-conformance workflow: go-stellar-sdk v0.9.0, with a known-failures file"
    uses: ./.github/workflows/sdk-conformance.yml
    with:
      sdk: go
      version: "v0.9.0"
      corpus-ref: ${{ github.sha }}
      known-failures: .github/known-failures/go.txt

  linter-action:
    name: "Linter action: wallet-backend at the pinned commit, with the accepted list"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: wallet-backend at the commit pinned in linter/accepted/wallet-backend.json
        run: |
          ref=$(python3 -c 'import json; print(json.load(open("linter/accepted/wallet-backend.json"))["pinned_commit"])')
          git init -q wallet-backend && cd wallet-backend
          git fetch -q --depth 1 https://github.com/stellar/wallet-backend.git "$ref"
          git checkout -q FETCH_HEAD
      - uses: ./linter
        with:
          working-directory: wallet-backend
          accepted: linter/accepted/wallet-backend.json

  # The one check to look at: it fails if any job above failed or was cancelled. A job skipped on
  # purpose (the replay, when no replay path changed) counts as passed.
  green:
    name: green
    if: always()
    needs: [changes, replay, quickcheck, corpus, guide, linter, linter-stellar-etl, conformance, findings, counts,
            unit-tests, security, reusable-conformance-js, reusable-conformance-go, linter-action]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "::error::not green: $bad"; exit 1; fi
          echo "green"
