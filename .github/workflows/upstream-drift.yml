# Upstream drift: once a week, compare every pinned upstream (stellar-core, stellar-xdr and the six
# SDKs) with its latest release, and open one issue per newer release in this repository, carrying
# the matching checklist from MAINTENANCE.md. The only workflow that writes issues.
name: upstream-drift

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "print what would be opened, open nothing"
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  drift:
    name: Pinned upstreams against their latest releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Image tags that moved upstream since they were pinned (report only; security/images.lock.json)
        run: python3 security/images.py drift
      - name: One issue per newer release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python .github/scripts/upstream_drift.py --dry-run
          else
            python .github/scripts/upstream_drift.py
          fi
