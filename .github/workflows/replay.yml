# The replay harness against stellar/wallet-backend: every sighting in harness/replay/sightings.json,
# then `replay.py check`. It builds nine wallet-backend commits (about 5 minutes). ci.yml calls it on
# every push to main and on pull requests and branch pushes that change the harness or the corpus,
# so that its result is part of ci's `green` check; it also runs weekly on its own, and on demand.
# A second job runs every ledger through stellar-etl's current master with the same oracle check.
name: replay

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  sightings:
    name: "RFP check 2: reference adapter reproduces wallet-backend #729, #731, #716 on pre-fix commits and passes on fixed ones"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Images by the digests in security/images.lock.json
        run: python3 security/images.py pull golang:1.26 timescale/timescaledb:2.28.2-pg17 python:3.14-slim
      # Weekly and on demand: the whole corpus at wallet-backend's current main, failing on any
      # unexplained oracle failure (a candidate new finding). Pushes and pull requests: sightings only.
      - name: Replay
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            harness/replay/run.sh full
          else
            harness/replay/run.sh sightings
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replay-results
          path: |
            harness/replay/RESULTS.md
            harness/replay/out/

  stellar-etl:
    name: every ledger through stellar-etl master, oracle checked
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Images by the digests in security/images.lock.json
        run: python3 security/images.py pull golang:1.27 golang:1.27.3 python:3.14-slim
      - name: Replay
        run: harness/replay/run.sh etl
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replay-results-stellar-etl
          path: |
            harness/replay/RESULTS-stellar-etl.md
            harness/replay/out-stellar-etl/

  memory:
    name: a 600 MB corpus is served within a 64 MB memory budget
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Images by the digests in security/images.lock.json
        run: python3 security/images.py pull python:3.14-slim
      - name: Feeder peak memory over a corpus ten times its budget
        run: python3 harness/replay/memcheck.py --corpus-mb 600 --budget-mb 64

  localcore-reproducible:
    name: local stellar-core corpus entries regenerate identically on testnet and mainnet passphrases
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Images by the digests in security/images.lock.json
        run: python3 security/images.py pull stellar/stellar-core:30.0.0-3642.0e49751aa.noble stellar/stellar-core:22.2.1-2429.e70f0aed8.focal
      - name: Regenerate under the testnet passphrase
        run: python3 tools/localcore_repro.py run --passphrase testnet --out /tmp/localcore/testnet
      - name: Regenerate under the mainnet passphrase
        run: python3 tools/localcore_repro.py run --passphrase pubnet --out /tmp/localcore/pubnet
      - name: Compare with corpus/ and corpus/localcore-reproducible.json
        run: python3 tools/localcore_repro.py check --run /tmp/localcore/testnet --run /tmp/localcore/pubnet

  sightings-rust:
    name: rs-stellar-xdr#598 and rs-soroban-sdk#2099 reproduce before their fixes and pass after
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build each probe against the releases before and with the fix
        run: harness/sightings/run.sh

  backtest:
    name: detection backtest claims hold against the recorded replays
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Every detected and missed fix in backtest.json, checked against harness/replay/backtest/
        run: python3 harness/replay/replay.py backtest
