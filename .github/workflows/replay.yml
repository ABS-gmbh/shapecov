# The replay harness against stellar/wallet-backend: every sighting in harness/replay/sightings.json,
# then `replay.py check`. It builds nine wallet-backend commits (about 5 minutes), so it runs on
# pushes and pull requests that change the harness or the corpus, weekly, and on demand.
# A second job runs every ledger through stellar-etl's current master with the same oracle check.
name: replay

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - "harness/replay/**"
      - "corpus/manifest.json"
      - "corpus/entries/**"
  pull_request:
    paths:
      - "harness/replay/**"
      - "corpus/manifest.json"
      - "corpus/entries/**"

permissions:
  contents: read

jobs:
  sightings:
    name: sightings reproduce before their fixes and pass after
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Weekly and on demand: the whole corpus at wallet-backend's current main, failing on any
      # unexplained oracle failure (a candidate new finding). Pushes and pull requests: sightings only.
      - name: Replay
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            harness/replay/run.sh full
          else
            harness/replay/run.sh sightings
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-results
          path: |
            harness/replay/RESULTS.md
            harness/replay/out/

  stellar-etl:
    name: every ledger through stellar-etl master, oracle checked
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay
        run: harness/replay/run.sh etl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-results-stellar-etl
          path: |
            harness/replay/RESULTS-stellar-etl.md
            harness/replay/out-stellar-etl/
