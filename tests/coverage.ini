# Line and branch coverage of the unit tests, for CI's "Unit tests" job. Scripts the tests run as
# subprocesses are measured too: the job sets COVERAGE_PROCESS_START to this file and installs a
# .pth hook that calls coverage.process_startup(). SHAPECOV_ROOT is the repository's absolute path,
# so subprocesses running in temporary directories still write their data here.
[run]
branch = true
parallel = true
data_file = ${SHAPECOV_ROOT}/.coverage
source = ${SHAPECOV_ROOT}
omit =
    ${SHAPECOV_ROOT}/tests/*
    ${SHAPECOV_ROOT}/runners/*
    ${SHAPECOV_ROOT}/harness/sdk-semantic/*
    ${SHAPECOV_ROOT}/linter/.work/*
    ${SHAPECOV_ROOT}/harness/replay/.work/*
    */node_modules/*
    */.venv/*

[report]
skip_empty = true
sort = Cover
precision = 1
